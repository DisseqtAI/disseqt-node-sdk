name: Release

# One-click release: bump package.json + src/version.ts together, stamp the
# CHANGELOG, gate on typecheck/lint/tests/build, commit + tag + GitHub
# release, then dispatch the existing publish.yml (npm publish with
# provenance). The explicit dispatch is required: a release created with
# the default GITHUB_TOKEN does not fire other workflows' `release:`
# triggers — but workflow_dispatch is the documented exception, so no PAT
# is needed. After npm, the backend advertises the new version
# automatically via its registry polling (SDK_VERSION_POLL_INTERVAL in
# production-monitoring) — no Vault bump, no restart.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        type: choice
        options: [patch, minor, major]
        default: minor
        required: true

permissions:
  contents: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Bump versions and stamp CHANGELOG
        id: prep
        run: |
          VERSION=$(python3 .github/scripts/prepare_release.py "${{ inputs.bump }}")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION"

      - name: Sync lockfile and install
        run: |
          npm install --package-lock-only
          npm ci

      - name: Gate on typecheck, lint, tests, build
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run build

      - name: Commit, tag, and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json CHANGELOG.md
          if [ -f src/version.ts ]; then git add src/version.ts; fi
          git commit -m "Release v${{ steps.prep.outputs.version }}"
          git tag "v${{ steps.prep.outputs.version }}"
          git push origin HEAD:main --follow-tags

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.prep.outputs.version }}" \
            --target main \
            --title "v${{ steps.prep.outputs.version }}" \
            --notes-file release_notes.md

      - name: Dispatch npm publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --ref main
